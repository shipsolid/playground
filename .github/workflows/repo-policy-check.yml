name: repo-policy check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shipsolid/repo-policy@v0
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_POLICY_TOKEN }}
        with:
          config: .github/repository-policy.yml
          mode: audit
